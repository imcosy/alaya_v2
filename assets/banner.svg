<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Alaya Memory Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="0.55" stop-color="#0c1224"/>
      <stop offset="1" stop-color="#141a2e"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c88a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8c88a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6fd3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6fd3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- 星尘 -->
  <g fill="#ffffff" opacity="0.15">
    <circle cx="120" cy="52" r="1.1"/><circle cx="268" cy="252" r="0.9"/><circle cx="410" cy="72" r="1.2"/>
    <circle cx="500" cy="280" r="0.8"/><circle cx="690" cy="46" r="1"/><circle cx="1020" cy="286" r="1"/>
    <circle cx="1146" cy="58" r="1.1"/><circle cx="1060" cy="200" r="0.8"/><circle cx="596" cy="170" r="0.7"/>
    <circle cx="180" cy="150" r="0.7"/><circle cx="640" cy="290" r="0.8"/>
  </g>

  <!-- 右侧：记忆网络 -->
  <g transform="translate(872 156)">
    <circle r="210" fill="url(#glowCyan)" opacity="0.5"/>
    <circle r="152" fill="url(#glowGold)" opacity="0.55" filter="url(#blur)"/>
    <g stroke="#8fa4c8" stroke-opacity="0.32" stroke-width="1" fill="none">
      <path d="M0 0 L-120 -58 M0 0 L-96 62 M0 0 L-18 -104 M0 0 L46 -96 M0 0 L104 -44
               M0 0 L118 34 M0 0 L58 92 M0 0 L-52 96 M0 0 L-140 10 M0 0 L20 118
               M-120 -58 L-18 -104 M-96 62 L-52 96 M46 -96 L104 -44 M118 34 L58 92
               M-140 10 L-120 -58 M20 118 L58 92"/>
    </g>
    <g fill="#e8c88a">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-120" cy="-58" r="4"/><circle cx="-96" cy="62" r="3.4"/><circle cx="-18" cy="-104" r="3.8"/>
      <circle cx="46" cy="-96" r="3"/><circle cx="104" cy="-44" r="3.6"/><circle cx="118" cy="34" r="3"/>
      <circle cx="58" cy="92" r="3.8"/><circle cx="-52" cy="96" r="3.2"/><circle cx="-140" cy="10" r="2.8"/>
      <circle cx="20" cy="118" r="2.6"/>
    </g>
    <g fill="#7fd0ff">
      <circle cx="-120" cy="-58" r="1.6"/><circle cx="46" cy="-96" r="1.4"/><circle cx="58" cy="92" r="1.5"/>
      <circle cx="-52" cy="96" r="1.3"/><circle cx="20" cy="118" r="1.2"/>
    </g>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#e8c88a" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="0" cy="0" r="27" fill="none" stroke="#e8c88a" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <!-- 标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="72" y="92" fill="#e8c88a" font-size="14" letter-spacing="6.5" opacity="0.88">MEMORY-NATIVE COGNITIVE ENGINE</text>
    <text x="68" y="172" fill="#f5f7fb" font-size="66" font-weight="700" letter-spacing="9">ALAYA</text>
    <text x="74" y="214" fill="#cfd6e6" font-size="23" letter-spacing="2.5">阿赖耶 · 记忆引擎</text>
    <text x="74" y="252" fill="#8b96ad" font-size="14.5">记忆不是被检索出来的，是此刻涌现出来的。</text>
    <text x="74" y="278" fill="#6d7890" font-size="12.5">Perception-native · Seed-based · Self-organizing · No vector-DB RAG</text>
  </g>

  <line x1="72" y1="298" x2="520" y2="298" stroke="#e8c88a" stroke-opacity="0.32" stroke-width="1.2"/>
</svg>
